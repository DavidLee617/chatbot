# C# 对照：application.yml ≈ appsettings.json；${ENV} 从环境变量读取
# 密钥只从环境变量读，不要在本文件里写真实值。

spring:
  application:
    name: psyqa
  main:
    banner-mode: off
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      # Spring AI 会自动拼接 /v1/chat/completions 和 /v1/embeddings，所以这里不要带 /v1
      base-url: https://dashscope.aliyuncs.com/compatible-mode
      chat:
        options:
          model: deepseek-v4.1-flash     # 2026-10-04 已用 /v1/models 核对
          temperature: 0.3
          stream-usage: true             # 流式调用时最后一个响应带 token 用量
          # deepseek-v4.1-flash 默认开启 thinking，关掉省延迟和 token
          extra-body:
            enable_thinking: false
      embedding:
        options:
          model: text-embedding-v4
          dimensions: 1024
    vectorstore:
      milvus:
        client:
          host: localhost
          port: 19530
        database-name: default
        collection-name: psyqa_chunks
        embedding-dimension: 1024
        index-type: HNSW
        metric-type: COSINE
        initialize-schema: true
    retry:
      max-attempts: 1                # ingest 有自己的批次重试，避免两层重试叠加
    model:
      # 只用 chat + embedding，关闭 OpenAI starter 顺带装配的其他模型
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none

server:
  port: 8080

psyqa:
  retrieval:
    top-k: 5
    similarity-threshold: 0.45     # 初始值，按日志里的分数分布再调
    # original / translated / both（T3 查询翻译）。按评估对比结果再定默认值
    query-mode: both
    # Milvus HNSW 搜索参数。默认值会漏掉真正最近的块（a14 实测），64 时和暴力计算一致
    hnsw-ef: 64
  ingest:
    books-dir: data/raw
    chunk-size-chars: 2000
    chunk-overlap-chars: 200
    embed-batch-size: 10           # text-embedding-v4 单次最多 10 条，超过会报错
  context:
    # 上下文预算（T4），规则见 ContextBudget：规则+问题 > 前 2 块 > 最近对话 > 其余块 > 摘要
    max-prompt-tokens: 6000
    min-chunks: 2
    keep-raw-turns: 4              # 摘要之后至少保留原文的最近 4 轮
    summarize-batch: 4             # 没摘要的轮次达到 4+4=8 轮时，把最早 4 轮压成要点（只追加）
  crisis:
    # 规则见 CrisisDetector：强关键词直接判危机；否则比较问题和两类例句的相似度
    strong-keywords-file: classpath:crisis/strong-keywords.txt
    weak-keywords-file: classpath:crisis/weak-keywords.txt
    examples-file: classpath:crisis/crisis-examples.txt
    theory-examples-file: classpath:crisis/theory-examples.txt
    semantic-threshold: 0.52       # 2026-10-07 按评估扫描选定：0.506–0.549 之间 0 漏判 0 误报，取偏"多报"的一侧
    # 上线前再核对一次号码
    hotline-text: "全国心理援助热线 12356；遇到紧急危险请拨打 120 / 110"
